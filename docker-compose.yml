services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: formfiller
      POSTGRES_USER: formfiller
      POSTGRES_PASSWORD: formfiller
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formfiller"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: formfiller
      MINIO_ROOT_PASSWORD: formfiller-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://formfiller:formfiller@postgres:5432/formfiller
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: formfiller
      S3_SECRET_KEY: formfiller-local-secret
      S3_BUCKET: formfiller
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build: .
    command: uv run celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://formfiller:formfiller@postgres:5432/formfiller
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: formfiller
      S3_SECRET_KEY: formfiller-local-secret
      S3_BUCKET: formfiller
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

volumes:
  postgres_data:
  minio_data:

