[project]
name = "ai-form-filler"
version = "0.1.0"
description = "Evidence-backed PDF and XLSX template inspector"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35",
  "celery>=5.4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "pillow>=11.1",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
  "openai>=3.17.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
